name: OEM core checks

on:
  push:
    branches: [development, feature/delivery-contracts, feature/economic-agents, feature/ship-purchasing]
    paths:
      - "src/core/**"
      - "Tests/core/**"
      - "CMakeLists.txt"
      - ".github/workflows/oem-core.yml"
  pull_request:
    paths:
      - "src/core/**"
      - "Tests/core/**"
      - "CMakeLists.txt"
      - ".github/workflows/oem-core.yml"

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release
      - name: Run tests
        run: ctest --test-dir build --output-on-failure
