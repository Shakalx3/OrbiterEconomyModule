name: OEM native spaceport test build

on:
  push:
    branches: [development]
    paths:
      - "src/orbiter/**"
      - "src/core/SurfaceDistance.h"
      - "SDK/Orbitersdk/include/**"
      - "SDK/Orbitersdk/lib/**"
      - ".github/workflows/oem-native-test.yml"
  pull_request:
    paths:
      - "src/orbiter/**"
      - "src/core/SurfaceDistance.h"
      - "SDK/Orbitersdk/include/**"
      - "SDK/Orbitersdk/lib/**"
      - ".github/workflows/oem-native-test.yml"

jobs:
  build-win32:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Build Orbiter 2010 MFD test module
        shell: cmd
        run: |
          cl /nologo /LD /EHsc /O2 /MD /DWIN32 /D_WINDOWS /D_USRDLL /I"SDK\\Orbitersdk\\include" src\\orbiter\\OEMSpaceportTest.cpp /link /LIBPATH:"SDK\\Orbitersdk\\lib" orbiter.lib gdi32.lib user32.lib /OUT:OEMSpaceportTest.dll
      - name: Upload test module
        uses: actions/upload-artifact@v4
        with:
          name: OEMSpaceportTest-win32
          path: OEMSpaceportTest.dll
          if-no-files-found: error
