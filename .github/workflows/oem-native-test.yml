name: OEM native spaceport test build

on:
  push:
    branches: [development]
    paths:
      - "src/orbiter/**"
      - "src/core/SurfaceDistance.h"
      - "src/core/SpaceportLanding.h"
      - "src/core/SpaceportLanding.cpp"
      - "SDK/Orbitersdk/include/**"
      - "SDK/Orbitersdk/lib/**"
      - ".github/workflows/oem-native-test.yml"
  pull_request:
    paths:
      - "src/orbiter/**"
      - "src/core/SurfaceDistance.h"
      - "src/core/SpaceportLanding.h"
      - "src/core/SpaceportLanding.cpp"
      - "SDK/Orbitersdk/include/**"
      - "SDK/Orbitersdk/lib/**"
      - ".github/workflows/oem-native-test.yml"

permissions:
  contents: write

jobs:
  build-win32:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Compile Orbiter Launchpad resources
        shell: cmd
        run: |
          rc /nologo /fo OEMSpaceportTest.res src\\orbiter\\OEMSpaceportTest.rc
          rc /nologo /fo OEMGroundContactTest.res src\\orbiter\\OEMGroundContactTest.rc
          rc /nologo /fo OEMLandingBridge.res src\\orbiter\\OEMLandingBridge.rc
      - name: Build Orbiter 2010 diagnostic and bridge modules
        shell: cmd
        run: |
          cl /nologo /LD /EHsc /O2 /MD /DWIN32 /D_WINDOWS /D_USRDLL /I"SDK\\Orbitersdk\\include" src\\orbiter\\OEMSpaceportTest.cpp OEMSpaceportTest.res /link /LIBPATH:"SDK\\Orbitersdk\\lib" orbiter.lib orbitersdk.lib gdi32.lib user32.lib /OUT:OEMSpaceportTest.dll
          cl /nologo /LD /EHsc /O2 /MD /DWIN32 /D_WINDOWS /D_USRDLL /I"SDK\\Orbitersdk\\include" src\\orbiter\\OEMGroundContactTest.cpp OEMGroundContactTest.res /link /LIBPATH:"SDK\\Orbitersdk\\lib" orbiter.lib orbitersdk.lib gdi32.lib user32.lib /OUT:OEMGroundContactTest.dll
          cl /nologo /LD /EHsc /O2 /MD /DWIN32 /D_WINDOWS /D_USRDLL /I"SDK\\Orbitersdk\\include" /I"src\\core" src\\orbiter\\OEMLandingBridge.cpp src\\core\\SpaceportLanding.cpp OEMLandingBridge.res /link /LIBPATH:"SDK\\Orbitersdk\\lib" orbiter.lib orbitersdk.lib gdi32.lib user32.lib /OUT:OEMLandingBridge.dll
      - name: Publish Win32 DLLs as GitHub release assets
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "oem-native-diagnostics-$($env:GITHUB_SHA.Substring(0, 12))"
          gh release create $tag OEMSpaceportTest.dll OEMGroundContactTest.dll OEMLandingBridge.dll --repo $env:GITHUB_REPOSITORY --title "OEM Native Diagnostics $tag" --notes "Orbiter 2010 Win32 MFD diagnostics and background bridge. OEMSpaceportTest is the unchanged 5 km base-distance reference. OEMGroundContactTest separately displays GetFlightStatus and VESSEL::GroundContact. OEMLandingBridge monitors all vessels after simulation steps and logs verified touchdown events. Runtime bridge validation is still required." --prerelease
