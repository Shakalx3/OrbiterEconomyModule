name: OEM native spaceport test build

on:
  push:
    branches: [development]
    paths:
      - "src/orbiter/**"
      - "src/core/SurfaceDistance.h"
      - "src/core/SpaceportLanding.h"
      - "src/core/SpaceportLanding.cpp"
      - "src/core/SimulationEvent.h"
      - "src/core/SimulationEvent.cpp"
      - "src/core/SimulationEventJournal.h"
      - "src/core/SimulationEventJournal.cpp"
      - "src/core/FlightTransition.h"
      - "src/core/FlightTransition.cpp"
      - "SDK/Orbitersdk/include/**"
      - "SDK/Orbitersdk/lib/**"
      - ".github/workflows/oem-native-test.yml"
  pull_request:
    paths:
      - "src/orbiter/**"
      - "src/core/SurfaceDistance.h"
      - "src/core/SpaceportLanding.h"
      - "src/core/SpaceportLanding.cpp"
      - "src/core/SimulationEvent.h"
      - "src/core/SimulationEvent.cpp"
      - "src/core/SimulationEventJournal.h"
      - "src/core/SimulationEventJournal.cpp"
      - "src/core/FlightTransition.h"
      - "src/core/FlightTransition.cpp"
      - "SDK/Orbitersdk/include/**"
      - "SDK/Orbitersdk/lib/**"
      - ".github/workflows/oem-native-test.yml"

permissions:
  contents: write

jobs:
  build-win32:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Compile Orbiter Launchpad resources
        shell: cmd
        run: |
          rc /nologo /fo OEMSpaceportTest.res src\orbiter\OEMSpaceportTest.rc
          rc /nologo /fo OEMGroundContactTest.res src\orbiter\OEMGroundContactTest.rc
          rc /nologo /fo OEMLandingBridge.res src\orbiter\OEMLandingBridge.rc
      - name: Build Orbiter 2010 diagnostic and bridge modules
        shell: cmd
        run: |
          cl /nologo /LD /EHsc /O2 /MD /DWIN32 /D_WINDOWS /D_USRDLL /I"SDK\Orbitersdk\include" src\orbiter\OEMSpaceportTest.cpp OEMSpaceportTest.res /link /LIBPATH:"SDK\Orbitersdk\lib" orbiter.lib orbitersdk.lib gdi32.lib user32.lib /OUT:OEMSpaceportTest.dll
          cl /nologo /LD /EHsc /O2 /MD /DWIN32 /D_WINDOWS /D_USRDLL /I"SDK\Orbitersdk\include" src\orbiter\OEMGroundContactTest.cpp OEMGroundContactTest.res /link /LIBPATH:"SDK\Orbitersdk\lib" orbiter.lib orbitersdk.lib gdi32.lib user32.lib /OUT:OEMGroundContactTest.dll
          cl /nologo /LD /EHsc /O2 /MD /DWIN32 /D_WINDOWS /D_USRDLL /I"SDK\Orbitersdk\include" /I"src\core" src\orbiter\OEMLandingBridge.cpp src\core\SpaceportLanding.cpp src\core\SimulationEvent.cpp src\core\SimulationEventJournal.cpp src\core\FlightTransition.cpp OEMLandingBridge.res /link /LIBPATH:"SDK\Orbitersdk\lib" orbiter.lib orbitersdk.lib gdi32.lib user32.lib /OUT:OEMLandingBridge.dll
      - name: Replace the rolling release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "oem-native-diagnostics-current"

          $release = gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes
            if ($LASTEXITCODE -ne 0) { throw "Could not delete previous rolling release" }
          }

          git ls-remote --exit-code --tags origin "refs/tags/$tag" *> $null
          if ($LASTEXITCODE -eq 0) {
            git push origin ":refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Could not delete previous rolling tag" }
          }

          gh release create $tag OEMSpaceportTest.dll OEMGroundContactTest.dll OEMLandingBridge.dll --repo $env:GITHUB_REPOSITORY --title "OEM Native Diagnostics (current)" --notes "Latest successful Win32 build for Orbiter 2010. OEMLandingBridge includes the background takeoff/landing monitor, persistent event journal, and OEM Flight Log MFD (open via MFD mode list; keyboard key L). The log pages through newest and older persisted events. Events are not yet settled financially." --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Could not publish rolling release" }
