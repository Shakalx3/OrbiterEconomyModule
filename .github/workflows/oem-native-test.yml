concurrency:
  group: oem-native-diagnostics-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-win32:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify checked-out source revision for PR DLL
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        shell: pwsh
        env:
          BUILD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:BUILD_SHA) { throw "Checked-out source $actual does not match PR head $env:BUILD_SHA" }
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Configure portable core tests
        shell: pwsh
        run: |
          cmake -S . -B build -A Win32
          if ($LASTEXITCODE -ne 0) { throw "Could not configure portable core tests" }
      - name: Build portable core tests
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "Portable core test build failed" }
      - name: Run portable core tests before DLL publication
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Portable core tests failed; refusing to publish test DLL" }
      - name: Compile Orbiter Launchpad resources
        shell: cmd
        run: |
          rc /nologo /fo OEMSpaceportTest.res src\orbiter\OEMSpaceportTest.rc
          rc /nologo /fo OEMGroundContactTest.res src\orbiter\OEMGroundContactTest.rc
          rc /nologo /fo OEMLandingBridge.res src\orbiter\OEMLandingBridge.rc
      - name: Build Orbiter 2010 diagnostic and bridge modules
        shell: cmd
        run: |
          cl /nologo /LD /EHsc /O2 /MD /DWIN32 /D_WINDOWS /D_USRDLL /I"SDK\Orbitersdk\include" src\orbiter\OEMSpaceportTest.cpp OEMSpaceportTest.res /link /LIBPATH:"SDK\Orbitersdk\lib" orbiter.lib orbitersdk.lib gdi32.lib user32.lib /OUT:OEMSpaceportTest.dll
          cl /nologo /LD /EHsc /O2 /MD /DWIN32 /D_WINDOWS /D_USRDLL /I"SDK\Orbitersdk\include" src\orbiter\OEMGroundContactTest.cpp OEMGroundContactTest.res /link /LIBPATH:"SDK\Orbitersdk\lib" orbiter.lib orbitersdk.lib gdi32.lib user32.lib /OUT:OEMGroundContactTest.dll
          cl /nologo /LD /EHsc /O2 /MD /DWIN32 /D_WINDOWS /D_USRDLL /I"SDK\Orbitersdk\include" /I"src\core" src\orbiter\OEMLandingBridge.cpp src\core\SpaceportLanding.cpp src\core\SimulationEvent.cpp src\core\SimulationEventJournal.cpp src\core\FlightTransition.cpp src\core\DockingTransition.cpp src\core\CargoServiceRegistry.cpp src\core\CargoManifest.cpp src\core\CargoTransferGate.cpp src\core\CargoServiceInventory.cpp src\core\CargoServiceInventoryConfig.cpp src\core\Ledger.cpp src\core\LedgerConfig.cpp src\core\CargoCatalogConfig.cpp src\core\Market.cpp src\core\MarketTrade.cpp src\core\EconomicAgent.cpp src\core\EconomicAgentConfig.cpp src\core\DeliveryContract.cpp src\core\MissionBoard.cpp src\core\MissionObjective.cpp src\core\MissionObjectiveBook.cpp src\core\MissionObjectiveBoard.cpp src\core\MissionEconomics.cpp src\core\EconomyJournal.cpp src\core\SpaceportRegistry.cpp src\core\EconomicLocationRegistry.cpp src\core\EconomicStationRegistry.cpp src\core\MissionIssuerRegistry.cpp src/core/PropellantPlan.cpp src/core/PropellantQuote.cpp src/core/PropellantTransaction.cpp src/core/PropellantTransactionJournal.cpp src/core/PrimaryResource.cpp src/core/PrimaryResourceConfig.cpp src/core/ProductionRecipe.cpp src/core/ProductionRecipeConfig.cpp src/core/ShipOwnership.cpp OEMLandingBridge.res /link /LIBPATH:"SDK\Orbitersdk\lib" orbiter.lib orbitersdk.lib gdi32.lib user32.lib /OUT:OEMLandingBridge.dll
      - name: Publish orbital shipyard test DLL
        if: (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || (github.event_name == 'push' && github.ref == 'refs/heads/feature/ship-purchasing')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:BUILD_SHA) { throw "DLL source revision mismatch: expected $env:BUILD_SHA, got $actual" }
          $tag = "oem-ship-purchasing-test"
          git tag -f $tag $env:BUILD_SHA
          if ($LASTEXITCODE -ne 0) { throw "Could not point the test tag at the build commit" }
          git push --force origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the exact test tag" }
          $remoteTagLine = git ls-remote origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0 -or -not $remoteTagLine) { throw "Could not verify the remote test tag" }
          $remoteTag = ($remoteTagLine -split '\s+')[0]
          if ($remoteTag -ne $env:BUILD_SHA) { throw "Remote test tag $remoteTag does not match build commit $env:BUILD_SHA" }
          $title = "OEM Orbital Shipyard Test (pre-release)"
          $notes = "Experimental Win32 Orbiter 2010 ship-purchasing build from commit $($env:BUILD_SHA). Stop Orbiter and replace only OEMLandingBridge.dll; keep OEMData and all existing journals. Open OEM Shipyard with MFD key B while the focused player vessel is docked to a registered orbital economic station (register it with OEM Economic Admin, key A). The catalogue is discovered from installed Config/Vessels classes whose configured module DLL exists. Select with Up/Down, press B to prepare, then Y or the CONFIRM MFD button to create and pay; X cancels. The first version supports orbital stations only. New vessels are created through oapiCreateVesselEx at a size-scaled radial offset from the station, start with empty tanks, and are rejected if another vessel is inside the clearance radius. Prices are provisional estimates from EmptyMass and MaxFuel in the class config. Open OEM Player Fleet with MFD key V to inspect purchased vessels. Ownership is stored in OEMData/player_fleet.registry; company debits use the existing version-1 economy journal record format. TEST: check catalogue discovery, insufficient funds, successful purchase, spawn clearance, tank state, fleet listing, save/reload, and duplicate prevention. Do not delete OEMData or existing journals when updating the DLL. CI verifies compilation and automated tests, not in-simulator behavior; runtime testing is required before production use."
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title $title --notes $notes --target $env:BUILD_SHA --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Could not update ship-purchasing test release metadata" }
            gh release upload $tag OEMLandingBridge.dll --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag OEMLandingBridge.dll --repo $env:GITHUB_REPOSITORY --title $title --notes $notes --target $env:BUILD_SHA --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not publish ship-purchasing test DLL" }
          $published = gh release view $tag --repo $env:GITHUB_REPOSITORY --json targetCommitish,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not verify the published ship-purchasing release" }
          if ($published.targetCommitish -ne $env:BUILD_SHA) { throw "Release target $($published.targetCommitish) does not match build commit $env:BUILD_SHA" }
          $asset = $published.assets | Where-Object { $_.name -eq "OEMLandingBridge.dll" } | Select-Object -First 1
          if ($null -eq $asset -or [long]$asset.size -le 0) { throw "Published OEMLandingBridge.dll is missing or empty" }
          Write-Host "Verified OEMLandingBridge.dll ($($asset.size) bytes) for commit $env:BUILD_SHA"
      - name: Upload primary-resources test DLL
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/economic-agents'
        uses: actions/upload-artifact@v4
        with:
          name: OEM-primary-resources-test-${{ github.sha }}
          path: OEMLandingBridge.dll
          if-no-files-found: error
          retention-days: 14
      - name: Publish economic-agents test release
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/economic-agents'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) { throw "DLL source revision mismatch: expected $env:GITHUB_SHA, got $actual" }
          $tag = "oem-economic-agents-current"
          $title = "OEM Economic Agents (current test build)"
          $notes = "Latest successful Win32 Orbiter 2010 test build from feature/economic-agents. Includes automatic creation of missing OEMData starter files (accounts.cfg, cargo_catalog.cfg, cargo_services.cfg, primary_resources.cfg and propellant_prices.cfg); existing files are never overwritten. On a clean install the starter company account begins with 10000 credits and sample TEST cargo is installed. ISS cargo-service permission does not register ISS as an economic station; register stations through OEM Economic Admin (MFD key A). On a clean install, primary_resources.cfg is automatically populated with water, metals and electronics replenishment sources at each registered economic location; production_recipes.cfg receives oxygen electrolysis, hydroponics, fabrication and medical synthesis recipes. Missing defaults are appended for newly indexed locations while existing custom source and recipe definitions are preserved. Replace OEMLandingBridge.dll with Orbiter stopped. Keep OEMData to preserve campaign progress; deleting OEMData resets accounts, stock, journals, mission state and station registrations. CI success confirms compilation and automated core tests, not in-simulator testing. Source commit: $($env:GITHUB_SHA)."
          git tag -f $tag $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "Could not point release tag at build commit" }
          git push --force origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Could not publish release tag" }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title $title --notes $notes --target $env:GITHUB_SHA --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Could not update release metadata" }
            gh release upload $tag OEMLandingBridge.dll --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag OEMLandingBridge.dll --repo $env:GITHUB_REPOSITORY --title $title --notes $notes --target $env:GITHUB_SHA --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not publish OEMLandingBridge.dll" }
          $published = gh release view $tag --repo $env:GITHUB_REPOSITORY --json targetCommitish,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not verify published release" }
          if ($published.targetCommitish -ne $env:GITHUB_SHA) { throw "Release target does not match built source commit" }
          $asset = $published.assets | Where-Object { $_.name -eq "OEMLandingBridge.dll" } | Select-Object -First 1
          if ($null -eq $asset -or [long]$asset.size -le 0) { throw "Published DLL is missing or empty" }
          Write-Host "Verified OEMLandingBridge.dll ($($asset.size) bytes) for commit $env:GITHUB_SHA"
      - name: Replace the rolling release
        if: github.event_name == 'push' && github.ref == 'refs/heads/development'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "oem-native-diagnostics-current"
          $title = "OEM Native Diagnostics (current)"
          $notes = "Latest successful Win32 build for Orbiter 2010. OEMLandingBridge includes takeoff/landing and docking/undocking monitoring, the persistent flight event journal, generated OEMData\\spaceports.registry catalogue of Orbiter surface bases and VTOL pads, trusted cargo-service registry loading, and one global durable OEMData\\economy.journal for cargo exchanges and market trades. Old per-service cargo_exchanges and per-vessel cargo_manifests test journals are ignored and left untouched. Explicit opening stock is loaded from OEMData\\cargo_stock_<hex service vessel ID>.cfg; the release includes cargo_services.cfg with ISS registered and cargo_stock_495353.cfg with two TEST units (1 kg each). The release also includes sample accounts.cfg (company opening balance 10000 credits) and cargo_catalog.cfg (TEST cargo, 1 kg, buy 100, sell 60). Edit these examples to set the desired starting balance and market prices. The OEM Economic Admin MFD (key A) can register the focused vessel as an orbital station and independently enable/disable cargo-service access. The OEM Flight Log MFD (key L), read-only Cargo Manifest MFD (key C), Location Market MFD (key M), delivery contracts, independent missions, propellant monitor, refuelling, and Economic Admin are available. Diagnostic test modules are built only for CI and are not included in the user release. Market BUY/SELL operations require user-created accounts.cfg with a company account named company and cargo_catalog.cfg with explicit item definitions and prices. The sample setup is documented in Docs/ECONOMY_STARTUP.md. Both cargo exchanges and market trades update OEM accounting only; they do not alter Orbiter physical cargo or vessel mass. Station funds are unlimited; the company account is debited for purchases and credited for sales. The Location Market MFD (key M) supports cargo selection with Up/Down, quantity presets 1/5/10, maximum affordable/available quantity with A, and multi-unit BUY/SELL."
          git tag -f $tag $env:GITHUB_SHA
          git push --force origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Could not update rolling release tag" }

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title $title --notes $notes --target $env:GITHUB_SHA --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Could not update rolling release metadata" }
            $oldAssets = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
            foreach ($asset in $oldAssets.assets) {
              if ($asset.name -eq "OEMSpaceportTest.dll" -or $asset.name -eq "OEMGroundContactTest.dll") {
                gh release delete-asset $tag $asset.name --repo $env:GITHUB_REPOSITORY --yes
                if ($LASTEXITCODE -ne 0) { throw "Could not remove diagnostic asset $($asset.name)" }
              }
            }
            gh release upload $tag OEMLandingBridge.dll OEMData\\cargo_services.cfg OEMData\\cargo_stock_495353.cfg OEMData\\accounts.cfg OEMData\\cargo_catalog.cfg --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag OEMLandingBridge.dll OEMData\\cargo_services.cfg OEMData\\cargo_stock_495353.cfg --repo $env:GITHUB_REPOSITORY --title $title --notes $notes --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not publish rolling release assets" }
