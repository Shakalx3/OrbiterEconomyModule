    paths:
      - "src/orbiter/**"
      - "src/core/SurfaceDistance.h"
      - "src/core/SpaceportRegistry.h"
      - "src/core/SpaceportRegistry.cpp"
      - "src/core/EconomicLocationRegistry.h"
      - "src/core/EconomicLocationRegistry.cpp"
      - "src/core/EconomicStationRegistry.h"
      - "src/core/EconomicStationRegistry.cpp"
      - "src/core/SpaceportLanding.h"
      - "src/core/SpaceportLanding.cpp"
      - "src/core/PropellantPlan.h"
      - "src/core/PropellantPlan.cpp"
      - "src/core/SimulationEvent.h"
      - "src/core/SimulationEvent.cpp"
      - "src/core/SimulationEventJournal.h"
      - "src/core/SimulationEventJournal.cpp"
      - "src/core/FlightTransition.h"
      - "src/core/FlightTransition.cpp"
