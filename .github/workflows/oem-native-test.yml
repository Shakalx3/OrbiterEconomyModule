name: OEM native spaceport test build

on:
  push:
    branches: [development]
    paths:
      - "src/orbiter/**"
      - "src/core/SurfaceDistance.h"
      - "SDK/Orbitersdk/include/**"
      - "SDK/Orbitersdk/lib/**"
      - ".github/workflows/oem-native-test.yml"
  pull_request:
    paths:
      - "src/orbiter/**"
      - "src/core/SurfaceDistance.h"
      - "SDK/Orbitersdk/include/**"
      - "SDK/Orbitersdk/lib/**"
      - ".github/workflows/oem-native-test.yml"

permissions:
  contents: write

jobs:
  build-win32:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Compile Orbiter Launchpad resources
        shell: cmd
        run: |
          rc /nologo /fo OEMSpaceportTest.res src\\orbiter\\OEMSpaceportTest.rc
      - name: Build Orbiter 2010 MFD test module
        shell: cmd
        run: |
          cl /nologo /LD /EHsc /O2 /MD /DWIN32 /D_WINDOWS /D_USRDLL /I"SDK\\Orbitersdk\\include" src\\orbiter\\OEMSpaceportTest.cpp OEMSpaceportTest.res /link /LIBPATH:"SDK\\Orbitersdk\\lib" orbiter.lib orbitersdk.lib gdi32.lib user32.lib /OUT:OEMSpaceportTest.dll
      - name: Publish Win32 DLL as a GitHub release asset
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "oem-spaceport-test-$($env:GITHUB_SHA.Substring(0, 12))"
          gh release create $tag OEMSpaceportTest.dll --repo $env:GITHUB_REPOSITORY --title "OEM Spaceport Test $tag" --notes "Diagnostic Win32 MFD for Orbiter 2010. Includes Launchpad module metadata. Requires manual in-simulator validation." --prerelease
