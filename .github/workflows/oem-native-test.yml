name: OEM native spaceport test build

on:
  push:
    branches: [development]
    paths:
      - "src/orbiter/**"
      - "src/core/SurfaceDistance.h"
      - "src/core/SpaceportLanding.h"
      - "src/core/SpaceportLanding.cpp"
      - "src/core/SimulationEvent.h"
      - "src/core/SimulationEvent.cpp"
      - "src/core/SimulationEventJournal.h"
      - "src/core/SimulationEventJournal.cpp"
      - "src/core/FlightTransition.h"
      - "src/core/FlightTransition.cpp"
      - "src/core/DockingTransition.h"
      - "src/core/DockingTransition.cpp"
      - "src/core/CargoServiceRegistry.h"
      - "src/core/CargoServiceRegistry.cpp"
      - "src/core/CargoManifest.h"
      - "src/core/CargoManifest.cpp"
      - "src/core/CargoManifestJournal.h"
      - "src/core/CargoManifestJournal.cpp"
      - "src/core/CargoTransferGate.h"
      - "src/core/CargoTransferGate.cpp"
      - "src/core/CargoServiceInventory.h"
      - "src/core/CargoServiceInventory.cpp"
      - "src/core/CargoServiceInventoryConfig.h"
      - "src/core/CargoServiceInventoryConfig.cpp"
      - "src/core/CargoExchangeJournal.h"
      - "src/core/CargoExchangeJournal.cpp"
      - "src/core/Ledger.h"
      - "src/core/Ledger.cpp"
      - "src/core/LedgerConfig.h"
      - "src/core/LedgerConfig.cpp"
      - "src/core/CargoCatalogConfig.h"
      - "src/core/CargoCatalogConfig.cpp"
      - "src/core/Market.h"
      - "src/core/Market.cpp"
      - "src/core/MarketTrade.h"
      - "src/core/MarketTrade.cpp"
      - "src/core/EconomyJournal.h"
      - "src/core/EconomyJournal.cpp"
      - "OEMData/cargo_services.cfg"
      - "OEMData/cargo_stock_495353.cfg"
      - "SDK/Orbitersdk/include/**"
      - "SDK/Orbitersdk/lib/**"
      - ".github/workflows/oem-native-test.yml"
  pull_request:
    paths:
      - "src/orbiter/**"
      - "src/core/SurfaceDistance.h"
      - "src/core/SpaceportLanding.h"
      - "src/core/SpaceportLanding.cpp"
      - "src/core/SimulationEvent.h"
      - "src/core/SimulationEvent.cpp"
      - "src/core/SimulationEventJournal.h"
      - "src/core/SimulationEventJournal.cpp"
      - "src/core/FlightTransition.h"
      - "src/core/FlightTransition.cpp"
      - "src/core/DockingTransition.h"
      - "src/core/DockingTransition.cpp"
      - "src/core/CargoServiceRegistry.h"
      - "src/core/CargoServiceRegistry.cpp"
      - "src/core/CargoManifest.h"
      - "src/core/CargoManifest.cpp"
      - "src/core/CargoManifestJournal.h"
      - "src/core/CargoManifestJournal.cpp"
      - "src/core/CargoTransferGate.h"
      - "src/core/CargoTransferGate.cpp"
      - "src/core/CargoServiceInventory.h"
      - "src/core/CargoServiceInventory.cpp"
      - "src/core/CargoServiceInventoryConfig.h"
      - "src/core/CargoServiceInventoryConfig.cpp"
      - "src/core/CargoExchangeJournal.h"
      - "src/core/CargoExchangeJournal.cpp"
      - "src/core/Ledger.h"
      - "src/core/Ledger.cpp"
      - "src/core/LedgerConfig.h"
      - "src/core/LedgerConfig.cpp"
      - "src/core/CargoCatalogConfig.h"
      - "src/core/CargoCatalogConfig.cpp"
      - "src/core/Market.h"
      - "src/core/Market.cpp"
      - "src/core/MarketTrade.h"
      - "src/core/MarketTrade.cpp"
      - "src/core/EconomyJournal.h"
      - "src/core/EconomyJournal.cpp"
      - "SDK/Orbitersdk/include/**"
      - "SDK/Orbitersdk/lib/**"
      - ".github/workflows/oem-native-test.yml"

concurrency:
  group: oem-native-diagnostics-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-win32:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Compile Orbiter Launchpad resources
        shell: cmd
        run: |
          rc /nologo /fo OEMSpaceportTest.res src\orbiter\OEMSpaceportTest.rc
          rc /nologo /fo OEMGroundContactTest.res src\orbiter\OEMGroundContactTest.rc
          rc /nologo /fo OEMLandingBridge.res src\orbiter\OEMLandingBridge.rc
      - name: Build Orbiter 2010 diagnostic and bridge modules
        shell: cmd
        run: |
          cl /nologo /LD /EHsc /O2 /MD /DWIN32 /D_WINDOWS /D_USRDLL /I"SDK\Orbitersdk\include" src\orbiter\OEMSpaceportTest.cpp OEMSpaceportTest.res /link /LIBPATH:"SDK\Orbitersdk\lib" orbiter.lib orbitersdk.lib gdi32.lib user32.lib /OUT:OEMSpaceportTest.dll
          cl /nologo /LD /EHsc /O2 /MD /DWIN32 /D_WINDOWS /D_USRDLL /I"SDK\Orbitersdk\include" src\orbiter\OEMGroundContactTest.cpp OEMGroundContactTest.res /link /LIBPATH:"SDK\Orbitersdk\lib" orbiter.lib orbitersdk.lib gdi32.lib user32.lib /OUT:OEMGroundContactTest.dll
          cl /nologo /LD /EHsc /O2 /MD /DWIN32 /D_WINDOWS /D_USRDLL /I"SDK\Orbitersdk\include" /I"src\core" src\orbiter\OEMLandingBridge.cpp src\core\SpaceportLanding.cpp src\core\SimulationEvent.cpp src\core\SimulationEventJournal.cpp src\core\FlightTransition.cpp src\core\DockingTransition.cpp src\core\CargoServiceRegistry.cpp src\core\CargoManifest.cpp src\core\CargoTransferGate.cpp src\core\CargoServiceInventory.cpp src\core\CargoServiceInventoryConfig.cpp src\core\Ledger.cpp src\core\LedgerConfig.cpp src\core\CargoCatalogConfig.cpp src\core\Market.cpp src\core\MarketTrade.cpp src\core\EconomyJournal.cpp OEMLandingBridge.res /link /LIBPATH:"SDK\Orbitersdk\lib" orbiter.lib orbitersdk.lib gdi32.lib user32.lib /OUT:OEMLandingBridge.dll
      - name: Replace the rolling release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "oem-native-diagnostics-current"
          $title = "OEM Native Diagnostics (current)"
          $notes = "Latest successful Win32 build for Orbiter 2010. OEMLandingBridge includes background takeoff/landing and docking/undocking monitors, the persistent flight event journal, and trusted cargo-service registry loading from OEMData\\cargo_services.cfg. Cargo accounting now starts from explicit per-service opening stock in OEMData\\cargo_stock_<hex service vessel ID>.cfg and commits all future exchanges to one global durable OEMData\\economy.journal. The old per-service cargo_exchanges and per-vessel cargo_manifests test journals are intentionally ignored and are not migrated. The release includes cargo_services.cfg with ISS registered and cargo_stock_495353.cfg with two explicit TEST units (1 kg each) for the existing diagnostic procedure. Place both files in OEMData beside the DLL. The OEM Flight Log MFD (key L), read-only Cargo Manifest MFD (key C), and ledger-only Cargo Exchange Test MFD (key E) remain available. Exchanges update only OEM accounting and never Orbiter physical cargo or vessel mass. Market trading remains disabled until explicit accounts.cfg and cargo_catalog.cfg files are supplied."
          git tag -f $tag $env:GITHUB_SHA
          git push --force origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Could not update rolling release tag" }

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title $title --notes $notes --target $env:GITHUB_SHA --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Could not update rolling release metadata" }
            gh release upload $tag OEMSpaceportTest.dll OEMGroundContactTest.dll OEMLandingBridge.dll OEMData\\cargo_services.cfg OEMData\\cargo_stock_495353.cfg --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag OEMSpaceportTest.dll OEMGroundContactTest.dll OEMLandingBridge.dll OEMData\\cargo_services.cfg OEMData\\cargo_stock_495353.cfg --repo $env:GITHUB_REPOSITORY --title $title --notes $notes --prerelease
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not publish rolling release assets" }
